name: Publish GitHub release to Hangar

# Keep Hangar in sync with published GitHub releases without rebuilding Maven
# artifacts or creating a GitHub release as a side effect.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag to publish (e.g. v1.1.1)'
        required: true
        default: 'v1.1.1'
      prerelease:
        description: 'Use the Beta channel (requires a Beta channel on Hangar)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hangar-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload the Minecraft 26.3 build
    if: github.repository == 'thejames10/TownyDiscordChat'
    runs-on: ubuntu-latest
    steps:
      - name: Select the existing GitHub release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == 'release' ]]; then
            [[ "$EVENT_PRERELEASE" == 'true' ]] && channel=Beta || channel=Release
          else
            [[ "$INPUT_PRERELEASE" == 'true' ]] && channel=Beta || channel=Release
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Ensure Hangar token is configured
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          test -n "$HANGAR_API_TOKEN" || { echo "Missing repository secret HANGAR_API_TOKEN"; exit 1; }

      - name: Download the original GitHub release JAR and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hangar-packages
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'TownyDiscordChat-MC-26.3.jar' \
            --dir hangar-packages
          test -s hangar-packages/TownyDiscordChat-MC-26.3.jar
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > hangar-changelog.md
          if ! grep -q '[^[:space:]]' hangar-changelog.md; then
            printf 'See GitHub release: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" > hangar-changelog.md
          fi
          printf '\nOther Minecraft-specific builds: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> hangar-changelog.md

      - name: Upload the Paper 26.3 JAR to Hangar
        uses: milkdrinkers/Hangar-Publish@v2
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          slug: TownyDiscordChat
          version: ${{ steps.release.outputs.version }}
          channel: ${{ steps.release.outputs.channel }}
          description: ${{ github.event.release.body || format('Minecraft 26.3 release. Other version-specific builds: https://github.com/{0}/releases/tag/{1}', github.repository, steps.release.outputs.tag) }}
          files: |
            [
              {
                "path": "hangar-packages/TownyDiscordChat-MC-26.3.jar",
                "platforms": ["PAPER"]
              }
            ]
          platform_dependencies: |
            {
              "PAPER": ["26.3"]
            }
          plugin_dependencies: |
            {
              "PAPER": [
                {
                  "name": "Towny",
                  "required": true,
                  "externalUrl": "https://github.com/TownyAdvanced/Towny"
                },
                {
                  "name": "DiscordSRV",
                  "required": true,
                  "externalUrl": "https://github.com/DiscordSRV/DiscordSRV"
                }
              ]
