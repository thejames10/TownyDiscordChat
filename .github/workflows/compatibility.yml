name: Test Minecraft compatibility
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Maven Central answers bursts of parallel matrix downloads with HTTP 429.
  MAVEN_ARGS: -Daether.connector.http.retryHandler.count=5 -Dmaven.wagon.http.retryHandler.count=5
  # Oldest Spigot API, newest Spigot API and newest Paper API.
  PULL_REQUEST_VERSIONS: '["1.16.5", "1.21.11", "26.3"]'
  MAVEN_DEPENDENCY_PLUGIN: org.apache.maven.plugins:maven-dependency-plugin:3.8.1

jobs:
  repository-audit:
    name: Documentation and dependency consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check README, config, Maven and CI release matrix
        env:
          PUBLIC_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PUBLIC_PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python3 scripts/check_repo_consistency.py
          python3 scripts/check_public_boundaries.py
          python3 scripts/export_compatibility_matrix.py --check
          if test -n "$(git ls-files 'server/**')"; then
            echo "Test server binaries must not be tracked. Use the ignored server/ directory."
            exit 1
          fi

  # Pull requests and ordinary pushes build a representative subset; release
  # branches, tags, release commits and manual runs build every target.
  scope:
    name: Select build scope
    runs-on: ubuntu-latest
    outputs:
      full-matrix: ${{ steps.select.outputs.full-matrix }}
    steps:
      - id: select
        env:
          IS_FULL_MATRIX: >-
            ${{ github.event_name == 'workflow_dispatch' ||
                startsWith(github.ref, 'refs/tags/v') ||
                startsWith(github.ref, 'refs/heads/release/') ||
                startsWith(github.event.head_commit.message, 'release: TownyDiscordChat ') }}
        run: echo "full-matrix=$IS_FULL_MATRIX" >> "$GITHUB_OUTPUT"

  # One JAR, built against the oldest supported APIs (the pom.xml defaults),
  # is released for every Minecraft version in the matrix below.
  package:
    name: Plugin JAR for every Minecraft version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Match plugin version to tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build the plugin JAR against the oldest supported APIs
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify packaged plugin version and server API
        run: |
          version=$(sed -n 's:^  <version>\(.*\)</version>$:\1:p' pom.xml)
          api_version=$(sed -n 's:.*<bukkit.api.version>\(.*\)</bukkit.api.version>.*:\1:p' pom.xml)
          jar="target/TownyDiscordChat-$version.jar"
          unzip -p "$jar" plugin.yml | grep -Fxq "version: '$version'"
          unzip -p "$jar" plugin.yml | grep -Fxq "api-version: '$api_version'"
          echo "PLUGIN_JAR=$jar" >> "$GITHUB_ENV"

      - name: Ensure server-provided dependencies are not bundled
        run: |
          if jar tf "$PLUGIN_JAR" | grep -E '^github/scarsz/discordsrv/|^com/palmergames/bukkit/towny/|^net/dv8tion/jda/|^com/google/protobuf/'; then
            echo 'Towny, DiscordSRV, JDA or protobuf was bundled into TownyDiscordChat.'
            exit 1
          fi

      - name: Verify SQLite and MySQL JDBC driver packaging
        run: |
          jar tf "$PLUGIN_JAR" | grep -Fq 'org/sqlite/JDBC.class'
          jar tf "$PLUGIN_JAR" | grep -Fq 'com/mysql/cj/jdbc/Driver.class'
          unzip -p "$PLUGIN_JAR" META-INF/services/java.sql.Driver | grep -Fq 'org.sqlite.JDBC'
          unzip -p "$PLUGIN_JAR" META-INF/services/java.sql.Driver | grep -Fq 'com.mysql.cj.jdbc.Driver'

      - name: Stage the release files
        run: |
          mkdir dist
          cp "$PLUGIN_JAR" dist/
          cp src/main/resources/config.yml dist/config.example.yml

      - uses: actions/upload-artifact@v4
        with:
          name: TownyDiscordChat-plugin
          path: dist/
          if-no-files-found: error

  # Each target compiles and runs the unit tests against its own APIs, then
  # checks that every call in the released JAR still exists in those APIs.
  build:
    name: MC ${{ matrix.minecraft }} / compile, tests and API link check
    needs: [scope, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Towny 0.100.3.0 is the final historical series for 1.16–1.18.
          # Use Towny's official published JAR, NOT the JitPack parent-only artifact.
          # DiscordSRV 1.30.5 supports the older Minecraft versions too.
          - { minecraft: '1.16.5', towny: '0.100.3.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.16', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.16.5-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.17.1', towny: '0.100.3.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.17', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.17.1-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.18.2', towny: '0.100.3.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.18', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.18.2-R0.1-SNAPSHOT', jdk: '21' }
          # Newer Minecraft: Towny uses the maintained Maven coordinates.
          - { minecraft: '1.19.4', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.19', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.19.4-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.20.1', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.20', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.20.1-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.20.6', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.20.5', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.20.6-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.1', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.1-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.4', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.4-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.8', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.8-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.10', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.10-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.11', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.11-R0.1-SNAPSHOT', jdk: '21', adventure: '4.26.1' }
          # Paper 26.x requires Java 25 and its build-qualified Maven API.
          # 26.1.0 has no Paper build, and 26.1.1 has only obsolete alpha builds.
          - { minecraft: '26.1.2', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '26.1', apiGroup: 'io.papermc.paper', apiArtifact: 'paper-api', apiRelease: '26.1.2.build.74-stable', jdk: '25', adventure: '4.26.1' }
          - { minecraft: '26.2', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '26.2', apiGroup: 'io.papermc.paper', apiArtifact: 'paper-api', apiRelease: '26.2.build.129-stable', jdk: '25', adventure: '5.2.0' }
          - { minecraft: '26.3', towny: '0.103.2.15', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '26.3', apiGroup: 'io.papermc.paper', apiArtifact: 'paper-api', apiRelease: '26.3.build.218-stable', jdk: '25', adventure: '5.2.0' }

    env:
      TARGET_PROPERTIES: >-
        -Dserver.api.groupId=${{ matrix.apiGroup }}
        -Dserver.api.artifactId=${{ matrix.apiArtifact }}
        -Dserver.api.version=${{ matrix.apiRelease }}
        -Dbukkit.api.version=${{ matrix.apiVersion }}
        -Dadventure.version=${{ matrix.adventure || '4.21.0' }}
        -Ddiscordsrv.version=1.30.5
        -Dtowny.version=${{ matrix.towny }}
        -Dtowny.groupId=${{ matrix.townyGroup }}
        -Dtowny.artifactId=${{ matrix.townyArtifact }}

    steps:
      - name: Check whether this target is in scope
        env:
          IN_SCOPE: >-
            ${{ needs.scope.outputs.full-matrix == 'true' ||
                contains(fromJSON(env.PULL_REQUEST_VERSIONS), matrix.minecraft) }}
        run: echo "BUILD_TARGET=$IN_SCOPE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.BUILD_TARGET == 'true'
      - uses: actions/setup-java@v4
        if: env.BUILD_TARGET == 'true'
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Compile and test against this Minecraft version's APIs
        if: env.BUILD_TARGET == 'true'
        run: mvn --batch-mode --no-transfer-progress $TARGET_PROPERTIES clean verify

      - uses: actions/download-artifact@v4
        if: env.BUILD_TARGET == 'true'
        with:
          name: TownyDiscordChat-plugin
          path: release

      - name: Check every call in the plugin JAR exists in these APIs
        if: env.BUILD_TARGET == 'true'
        run: |
          mvn --batch-mode --no-transfer-progress --quiet $TARGET_PROPERTIES \
            "$MAVEN_DEPENDENCY_PLUGIN:build-classpath" \
            -Dmdep.includeScope=compile -Dmdep.outputFile=api-classpath.txt
          java scripts/ApiLinkCheck.java release/TownyDiscordChat-*.jar api-classpath.txt

  # Keeps the source compiling against the oldest Towny and DiscordSRV APIs
  # the code still supports; nothing from this job is released.
  legacy-api-check:
    name: Historical API source-compatibility check
    needs: scope
    if: needs.scope.outputs.full-matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile against historic plugin APIs (no release artifact)
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dserver.api.version=1.16.5-R0.1-SNAPSHOT \
            -Dbukkit.api.version=1.16 \
            -Ddiscordsrv.version=1.24.0 \
            -Dtowny.version=0.97.5.0 \
            -Dtowny.groupId=com.github.TownyAdvanced \
            -Dtowny.artifactId=Towny \
            clean verify

  storage-migration:
    name: SQLite and MySQL migration integration
    needs: scope
    if: needs.scope.outputs.full-matrix == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: tdc-ci-password
          MYSQL_DATABASE: tdc_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptdc-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      TDC_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/tdc_migration_test?useSSL=false&allowPublicKeyRetrieval=true
      TDC_TEST_MYSQL_USER: root
      TDC_TEST_MYSQL_PASSWORD: tdc-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify SQLite SQL operations and full-fidelity MySQL export
        run: mvn --batch-mode --no-transfer-progress clean verify

  release:
    name: Publish the GitHub pre-release
    if: >-
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: TownyDiscordChat ')
    needs: [package, build, legacy-api-check, storage-migration, repository-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TownyDiscordChat-plugin
          path: packages
      - name: Match the release commit, notes and files to pom.xml
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version=$(sed -n 's:^  <version>\(.*\)</version>$:\1:p' pom.xml)
          subject=${COMMIT_MESSAGE%%$'\n'*}
          if [[ "$subject" != "release: TownyDiscordChat $version" ]]; then
            echo "::error::The commit says '$subject' but pom.xml is version $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released; bump the version in pom.xml"
            exit 1
          fi
          test -s ".github/release-notes/v$version.md"
          test -s "packages/TownyDiscordChat-$version.jar"
          test -s packages/config.example.yml
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Every release so far is a pre-release; change both lines for a stable one.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pre-Release Build ${{ steps.release.outputs.version }}
          body_path: .github/release-notes/v${{ steps.release.outputs.version }}.md
          files: |
            packages/TownyDiscordChat-${{ steps.release.outputs.version }}.jar
            packages/config.example.yml
          generate_release_notes: false
          fail_on_unmatched_files: true
          prerelease: true
