main: com.TownyDiscordChat.TownyDiscordChat.Main
name: TownyDiscordChat
version: '${project.version}'
api-version: '${bukkit.api.version}'
authors: 
- thejames10
- Hugo5000

softdepend: [DiscordSRV, Towny, TownyChat]
folia-supported: true

commands:
  TownyDiscordChat:
    description: Town Discord status and linking; reload, debug and checks for admins
    aliases: [tdc]
    usage: /tdc [status|link|help|reload|debug|check]
  tdcqueue:
    description: View or retry the durable Discord task queue
    aliases: [tdcsql]
    usage: /tdcqueue [status|retry-dead|audit]
    permission: townydiscordchat.queue

permissions:
  townydiscordchat.admin:
    description: Every TownyDiscordChat command and admin notice
    default: op
    children:
      townydiscordchat.player: true
      townydiscordchat.reload: true
      townydiscordchat.debug: true
      townydiscordchat.queue: true
      townydiscordchat.reconcile: true
      townydiscordchat.notify: true
  townydiscordchat.player:
    description: /tdc, /tdc status, /tdc link and /tdc help
    default: true
  townydiscordchat.reload:
    description: /tdc reload
    default: op
  townydiscordchat.debug:
    description: /tdc debug
    default: op
  townydiscordchat.queue:
    description: /tdcqueue
    default: op
  townydiscordchat.reconcile:
    description: /tdc check
    default: op
  townydiscordchat.notify:
    description: In-game safe-mode, admin warning and update notices
    default: op
  # Names used by 1.1.x and earlier; they still grant /tdc check.
  townydiscordchat.check.role:
    default: false
    children:
      townydiscordchat.reconcile: true
  townydiscordchat.check.role.alllinked:
    default: false
    children:
      townydiscordchat.reconcile: true
  townydiscordchat.check.role.createalltownsandnations:
    default: false
    children:
      townydiscordchat.reconcile: true
  townydiscordchat.check.textchannel.alltownsandnations:
    default: false
    children:
      townydiscordchat.reconcile: true
  townydiscordchat.check.voicechannel.alltownsandnations:
    default: false
    children:
      townydiscordchat.reconcile: true
