name: Test Minecraft compatibility
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-audit:
    name: Documentation and dependency consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check README, config, Maven and CI release matrix
        env:
          PUBLIC_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PUBLIC_PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python3 scripts/check_repo_consistency.py
          python3 scripts/check_public_boundaries.py
          python3 scripts/export_compatibility_matrix.py --check
          if test -n "$(git ls-files 'server/**')"; then
            echo "Test server binaries must not be tracked. Use the ignored server/ directory."
            exit 1
          fi

  build:
    name: MC ${{ matrix.minecraft }} / TDC test package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Towny 0.100.3.0 is the final historical series for 1.16–1.18.
          # Use Towny's official published JAR, NOT the JitPack parent-only artifact.
          # DiscordSRV 1.30.5 supports the older Minecraft versions too.
          - { minecraft: '1.16.5', towny: '0.100.3.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.16', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.16.5-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.17.1', towny: '0.100.3.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.17', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.17.1-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.18.2', towny: '0.100.3.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.18', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.18.2-R0.1-SNAPSHOT', jdk: '21' }
          # Newer Minecraft: Towny uses the maintained Maven coordinates.
          - { minecraft: '1.19.4', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.19', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.19.4-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.20.1', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.20', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.20.1-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.20.6', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.20.5', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.20.6-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.1', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.1-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.4', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.4-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.8', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.8-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.10', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.10-R0.1-SNAPSHOT', jdk: '21' }
          - { minecraft: '1.21.11', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '1.21', apiGroup: 'org.spigotmc', apiArtifact: 'spigot-api', apiRelease: '1.21.11-R0.1-SNAPSHOT', jdk: '21', adventure: '4.26.1' }
          # Paper 26.x requires Java 25 and its build-qualified Maven API.
          # 26.1.0 has no Paper build, and 26.1.1 has only obsolete alpha builds.
          - { minecraft: '26.1.2', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '26.1', apiGroup: 'io.papermc.paper', apiArtifact: 'paper-api', apiRelease: '26.1.2.build.74-stable', jdk: '25', adventure: '4.26.1' }
          - { minecraft: '26.2', towny: '0.103.2.0', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '26.2', apiGroup: 'io.papermc.paper', apiArtifact: 'paper-api', apiRelease: '26.2.build.129-stable', jdk: '25', adventure: '5.2.0' }
          - { minecraft: '26.3', towny: '0.103.2.15', townyGroup: 'com.palmergames.bukkit.towny', townyArtifact: 'towny', apiVersion: '26.3', apiGroup: 'io.papermc.paper', apiArtifact: 'paper-api', apiRelease: '26.3.build.218-stable', jdk: '25', adventure: '5.2.0' }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Match plugin version to tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Compile, test, and package for the selected Minecraft API
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dserver.api.groupId=${{ matrix.apiGroup }} \
            -Dserver.api.artifactId=${{ matrix.apiArtifact }} \
            -Dserver.api.version=${{ matrix.apiRelease }} \
            -Dbukkit.api.version=${{ matrix.apiVersion }} \
            -Dadventure.version=${{ matrix.adventure || '4.21.0' }} \
            -Ddiscordsrv.version=1.30.5 \
            -Dtowny.version=${{ matrix.towny }} \
            -Dtowny.groupId=${{ matrix.townyGroup }} \
            -Dtowny.artifactId=${{ matrix.townyArtifact }} \
            clean verify

      - name: Verify packaged plugin version and server API
        run: |
          unzip -p target/TownyDiscordChat-*.jar plugin.yml | grep -Fq "version: '1.1.1'"
          unzip -p target/TownyDiscordChat-*.jar plugin.yml | grep -Fq "api-version: '${{ matrix.apiVersion }}'"

      - name: Ensure server-provided dependencies are not bundled
        run: |
          if jar tf target/TownyDiscordChat-*.jar | grep -E '^github/scarsz/discordsrv/|^com/palmergames/bukkit/towny/|^net/dv8tion/jda/'; then
            echo 'Towny, DiscordSRV, or JDA was bundled into TownyDiscordChat.'
            exit 1
          fi

      - name: Verify SQLite and MySQL JDBC driver packaging
        run: |
          jar tf target/TownyDiscordChat-*.jar | grep -Fq 'org/sqlite/JDBC.class'
          jar tf target/TownyDiscordChat-*.jar | grep -Fq 'com/mysql/cj/jdbc/Driver.class'
          unzip -p target/TownyDiscordChat-*.jar META-INF/services/java.sql.Driver | grep -Fq 'org.sqlite.JDBC'
          unzip -p target/TownyDiscordChat-*.jar META-INF/services/java.sql.Driver | grep -Fq 'com.mysql.cj.jdbc.Driver'

      - name: Package single, version-labeled test download
        run: |
          mkdir -p staging
          cp target/TownyDiscordChat-*.jar staging/TownyDiscordChat-MC-${{ matrix.minecraft }}.jar
          cp README.md COMPATIBILITY.md SYNC-MIGRATION.md TEST-PLAN.md staging/
          cp src/main/resources/config.yml staging/config.example.yml
          cat > staging/BUILD-INFO.txt <<EOF
          Minecraft: ${{ matrix.minecraft }}
          Server API: ${{ matrix.apiGroup }}:${{ matrix.apiArtifact }}:${{ matrix.apiRelease }}
          Server plugin.yml api-version: ${{ matrix.apiVersion }}
          Build JDK: ${{ matrix.jdk }}
          Adventure API: ${{ matrix.adventure || '4.21.0' }}
          DiscordSRV compile API: 1.30.5
          Towny compile API: ${{ matrix.towny }}
          Towny Maven coordinates: ${{ matrix.townyGroup }}:${{ matrix.townyArtifact }}
          Dependencies are NOT bundled; install compatible server plugins separately.
          Compilation is not live-server compatibility certification.
          EOF
          (cd staging && zip -r ../TownyDiscordChat-MC-${{ matrix.minecraft }}.zip .)
          cp "staging/TownyDiscordChat-MC-${{ matrix.minecraft }}.jar" .

      - uses: actions/upload-artifact@v7
        with:
          name: TownyDiscordChat-MC-${{ matrix.minecraft }}
          path: |
            TownyDiscordChat-MC-${{ matrix.minecraft }}.zip
            TownyDiscordChat-MC-${{ matrix.minecraft }}.jar
          if-no-files-found: error

  # Keep the old API smoke-test for developers, but do NOT publish two
  # confusing user-facing packages for the same Minecraft version.
  legacy-api-check:
    name: Historical API source-compatibility check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile against historic plugin APIs (no release artifact)
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dserver.api.version=1.16.5-R0.1-SNAPSHOT \
            -Dbukkit.api.version=1.16 \
            -Ddiscordsrv.version=1.24.0 \
            -Dtowny.version=0.97.5.0 \
            -Dtowny.groupId=com.github.TownyAdvanced \
            -Dtowny.artifactId=Towny \
            clean verify

  storage-migration:
    name: SQLite and MySQL migration integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: tdc-ci-password
          MYSQL_DATABASE: tdc_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptdc-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      TDC_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/tdc_migration_test?useSSL=false&allowPublicKeyRetrieval=true
      TDC_TEST_MYSQL_USER: root
      TDC_TEST_MYSQL_PASSWORD: tdc-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify SQLite SQL operations and full-fidelity MySQL export
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dserver.api.version=1.20.1-R0.1-SNAPSHOT \
            -Dbukkit.api.version=1.20 \
            -Ddiscordsrv.version=1.30.5 \
            -Dtowny.version=0.103.2.0 \
            -Dtowny.groupId=com.palmergames.bukkit.towny \
            -Dtowny.artifactId=towny \
            clean verify

  release:
    name: Publish v1.1.1 pre-release (14 JARs and 14 ZIPs)
    if: >-
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: TownyDiscordChat 1.1.1')
    needs: [build, legacy-api-check, storage-migration, repository-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TownyDiscordChat-MC-*
          path: packages
          merge-multiple: true
      - name: Verify all fourteen JARs and ZIPs
        run: |
          grep -q '<version>1.1.1</version>' pom.xml
          test "$(find packages -maxdepth 1 -name 'TownyDiscordChat-MC-*.jar' | wc -l)" -eq 14
          test "$(find packages -maxdepth 1 -name 'TownyDiscordChat-MC-*.zip' | wc -l)" -eq 14
          for mc in 1.16.5 1.17.1 1.18.2 1.19.4 1.20.1 1.20.6 1.21.1 1.21.4 1.21.8 1.21.10 1.21.11 26.1.2 26.2 26.3; do
            test -s "packages/TownyDiscordChat-MC-$mc.jar"
            test -s "packages/TownyDiscordChat-MC-$mc.zip"
            jar tf "packages/TownyDiscordChat-MC-$mc.jar" | grep -Fq 'plugin.yml'
            unzip -l "packages/TownyDiscordChat-MC-$mc.zip" | grep -Fq "TownyDiscordChat-MC-$mc.jar"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          target_commitish: ${{ github.sha }}
          name: Pre-Release Build 1.1.1
          body_path: .github/release-notes/v1.1.1.md
          files: |
            packages/TownyDiscordChat-MC-*.jar
            packages/TownyDiscordChat-MC-*.zip
          generate_release_notes: false
          fail_on_unmatched_files: true
          prerelease: true
