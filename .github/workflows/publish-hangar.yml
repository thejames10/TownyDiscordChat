name: Publish GitHub release to Hangar

# Keep Hangar in sync with published GitHub releases without rebuilding Maven
# artifacts or creating a GitHub release as a side effect.
on:
  release:
    types: [published]
  workflow_run:
    workflows: ['Test Minecraft compatibility']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag to publish (e.g. v1.1.1)'
        required: true
        default: 'v1.1.1'
      prerelease:
        description: 'Use the Beta channel (requires a Beta channel on Hangar)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hangar-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload the Minecraft 26.3 build
    if: >-
      github.repository == 'thejames10/TownyDiscordChat' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_commit.message, 'release: TownyDiscordChat ')))
    runs-on: ubuntu-latest
    steps:
      - name: Select the existing GitHub release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$WORKFLOW_MESSAGE" =~ ^release:\ TownyDiscordChat\ ([0-9]+\.[0-9]+\.[0-9]+) ]] || { echo "Cannot determine release version"; exit 1; }
            tag="v${BASH_REMATCH[1]}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            # The current CI release job creates a GitHub pre-release.
            channel=Beta
          elif [[ "$EVENT_NAME" == 'release' ]]; then
            [[ "$EVENT_PRERELEASE" == 'true' ]] && channel=Beta || channel=Release
          else
            [[ "$INPUT_PRERELEASE" == 'true' ]] && channel=Beta || channel=Release
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Ensure Hangar token is configured
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          test -n "$HANGAR_API_TOKEN" || { echo "Missing repository secret HANGAR_API_TOKEN"; exit 1; }

      - name: Verify the original GitHub release JAR and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq 'TownyDiscordChat-MC-26.3.jar'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > hangar-changelog.md
          if ! grep -q '[^[:space:]]' hangar-changelog.md; then
            printf 'See GitHub release: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" > hangar-changelog.md
          fi
          printf '\nOther Minecraft-specific builds: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> hangar-changelog.md

      # Bypass Hangar-Publish@v2's version-pattern resolver, which currently
      # drops Minecraft 26.3 and submits an empty PAPER compatibility list.
      # External GitHub release links avoid uploading oversized JAR payloads.
      - name: Publish GitHub JAR URL through the Hangar API
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://hangar.papermc.io/api/v1"
          echo "::add-mask::$HANGAR_API_TOKEN"
          auth_status=$(curl --silent --show-error --location --output auth-response.json \
            --write-out '%{http_code}' --request POST \
            --get --data-urlencode "apiKey=$HANGAR_API_TOKEN" \
            "$base/authenticate" \
            --header 'User-Agent: TownyDiscordChat-GitHub-Actions')
          if [[ "$auth_status" != "200" ]]; then
            echo "::error::Hangar authentication returned HTTP $auth_status"
            exit 1
          fi
          token=$(jq -er '.token' auth-response.json)
          echo "::add-mask::$token"
          rm -f auth-response.json
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/TownyDiscordChat-MC-26.3.jar"
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg channel "$RELEASE_CHANNEL" \
            --rawfile description hangar-changelog.md \
            --arg url "$download_url" \
            '{
              version: $version,
              channel: $channel,
              description: $description,
              files: [{platforms: ["PAPER"], url: true, externalUrl: $url}],
              platformDependencies: {PAPER: ["26.3"]},
              pluginDependencies: {PAPER: [
                {name: "Towny", required: true, externalUrl: "https://github.com/TownyAdvanced/Towny"},
                {name: "DiscordSRV", required: true, externalUrl: "https://github.com/DiscordSRV/DiscordSRV"}
              ]}
            }' > hangar-upload.json
          jq -e '.platformDependencies.PAPER == ["26.3"] and (.files | length) == 1' hangar-upload.json > /dev/null
          status=$(curl --silent --show-error --location --output upload-response.json \
            --write-out '%{http_code}' --request POST \
            --header "Authorization: $token" \
            --header 'User-Agent: TownyDiscordChat-GitHub-Actions' \
            --form 'versionUpload=@hangar-upload.json;type=application/json' \
            "$base/projects/TownyDiscordChat/upload")
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "::error::Hangar rejected release $RELEASE_VERSION (HTTP $status)."
            jq -r 'if type == "object" then (.message // .error // tostring) else tostring end' upload-response.json || cat upload-response.json
            exit 1
          fi
          echo "Hangar version published:"
          jq -r '.url // tostring' upload-response.json
